[tool.black]
line-length = 80
target-version = ["py311"]

[tool.pylint.main]
py-version = "3.11"
persistent = false

[tool.pylint.format]
max-line-length = 80
indent-string = "    "

[tool.pylint.basic]
# Google permite omitir docstrings que solo repiten el nombre de una prueba.
no-docstring-rgx = "^test_.*|^RetrievalTests$"

[tool.pylint.reports]
score = false
